<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Base-Ten Addition Workspace</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18253a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:20px}.app{max-width:850px;margin:auto}.card{background:white;border:1px solid #d9e1eb;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #152b4310}h1{font-size:clamp(22px,4vw,30px);margin:0 0 8px;text-align:center}.problem{text-align:center;font-size:clamp(28px,6vw,40px);font-weight:800;margin:8px}.sub{color:#5e6d81;font-size:13px;text-align:center}.starting{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);align-items:start;gap:10px}.group{min-width:0;text-align:center}.group strong{font-size:24px}.plus{font-size:28px;font-weight:700;padding-top:2px}.blocks{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;align-items:flex-start;gap:6px;min-height:90px;margin-top:12px}.workspace{border:2px dashed #afbed1;border-radius:12px;min-height:140px;padding:12px;justify-content:flex-start}.ten,.one,.hundred{flex-shrink:0;cursor:pointer;touch-action:manipulation;transition:transform .12s;border-radius:3px}.ten:hover,.one:hover,.hundred:hover{transform:translateY(-2px)}.ten{height:76px;width:17px;border:1px solid #2e72a9;background:repeating-linear-gradient(to bottom,#8ac8f1 0 6.6px,#2f7eaf 6.6px 7.6px)}.one{width:22px;height:22px;background:#f4c56d;border:1px solid #b78426}.hundred{width:85px;height:85px;border:1px solid #276f93;background:repeating-linear-gradient(0deg,transparent 0 7px,#4389ad 7px 8px),repeating-linear-gradient(90deg,#9bd3e7 0 7px,#4389ad 7px 8px)}.blocks button{padding:0}.blocks button:focus-visible{outline:3px solid #5c52de;outline-offset:3px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.controls button,.action{border:1px solid #c8d3e2;border-radius:9px;background:#f9fbff;padding:11px 14px;color:#17273c;font-weight:650;cursor:pointer}.controls button:disabled{opacity:.4;cursor:not-allowed}.controls .reset{margin-left:auto}.action{background:#5144c6;color:white;border-color:#5144c6}.answer{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}.answer input{width:125px;font-size:23px;padding:9px;border:1px solid #bccadd;border-radius:9px;text-align:center}.feedback{text-align:center;min-height:25px;font-weight:650;margin-top:12px}.legend{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;color:#65758a;font-size:12px}.legend .ten{height:35px;width:9px}.legend .one{height:16px;width:16px}.legend .hundred{height:29px;width:29px}.heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.heading h2{font-size:17px;margin:0}.small{font-size:13px;color:#63758b}.empty{color:#8491a2;font-size:13px;margin:auto}.workspace .empty{align-self:center}button:focus-visible{outline:3px solid #7268e4;outline-offset:2px}@media(max-width:450px){body{padding:10px}.card{padding:12px}.controls button{flex:1 1 auto;padding:10px 8px;font-size:12px}.controls .reset{margin-left:0}.blocks{gap:4px}.one{width:19px;height:19px}}
</style>
</head>
<body><main class="app">
<h1>Base-Ten Addition</h1><div class="sub">Tap a block to move it into the workspace. Tap a workspace block to return it.</div>
<section class="card"><div class="problem" id="problem">27 + 35 = ?</div><div class="heading"><h2>Starting blocks</h2><span class="small">Tap to move ↓</span></div><div class="starting"><div class="group"><strong id="labelA">27</strong><div class="blocks" id="startA"></div></div><div class="plus">+</div><div class="group"><strong id="labelB">35</strong><div class="blocks" id="startB"></div></div></div></section>
<section class="card"><div class="heading"><h2>Workspace</h2><span class="small" id="workspaceValue">0 in workspace</span></div><div class="blocks workspace" id="work"></div><div class="controls"><button id="combine" type="button">Combine 10 ones</button><button id="break" type="button">Break apart a ten</button><button id="return" class="reset" type="button">Return all</button></div><p class="sub" id="hint">You can exchange 10 ones for a ten, or one ten for 10 ones.</p></section>
<section class="card"><form id="form" class="answer"><label for="answer"><strong>Answer:</strong></label><input id="answer" type="number" step="1" inputmode="numeric" autocomplete="off" placeholder="?" required><button class="action" type="submit">Submit</button></form><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div style="text-align:center;margin-top:12px"><button id="next" type="button" class="action">New problem ↻</button></div></section>
<div class="legend"><span class="one"></span> 1 <span class="ten"></span> 10 <span class="hundred"></span> 100</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
let first=27,second=35,blocks=[],nextId=0;
function add(value,origin,place){blocks.push({id:nextId++,value,origin,place});}
function setup(a,b){first=a;second=b;blocks=[];nextId=0;for(const [n,origin] of [[a,'A'],[b,'B']]){for(let i=0;i<Math.floor(n/10);i++)add(10,origin,'start');for(let i=0;i<n%10;i++)add(1,origin,'start');}$('answer').value='';$('feedback').textContent='';render();}
function area(id,items){const el=$(id);el.replaceChildren();items.sort((a,b)=>b.value-a.value||a.id-b.id);if(id==='work'&&!items.length){const e=document.createElement('span');e.className='empty';e.textContent='Your blocks will appear here';el.append(e);}for(const item of items){const btn=document.createElement('button');btn.type='button';btn.className=item.value===100?'hundred':item.value===10?'ten':'one';btn.title=`${item.value} — tap to ${item.place==='work'?'return':'move into workspace'}`;btn.setAttribute('aria-label',btn.title);btn.onclick=()=>{if(item.place==='work'){item.place='start';}else{item.place='work';}clearFeedback();render();};el.append(btn);}}
function clearFeedback(){$('feedback').textContent='';}
function render(){$('problem').textContent=`${first} + ${second} = ?`;$('labelA').textContent=first;$('labelB').textContent=second;area('startA',blocks.filter(b=>b.place==='start'&&b.origin==='A'));area('startB',blocks.filter(b=>b.place==='start'&&b.origin==='B'));const work=blocks.filter(b=>b.place==='work');area('work',work);$('workspaceValue').textContent=`${work.reduce((s,b)=>s+b.value,0)} in workspace`;$('combine').disabled=work.filter(b=>b.value===1).length<10;$('break').disabled=!work.some(b=>b.value===10);$('return').disabled=!work.length;}
// Each block retains its original source even when exchanged. A ten created from
// mixed-source ones records its composition so it can be broken apart correctly.
function contents(block){return block.contents||Array(block.value).fill(block.origin);}
$('combine').onclick=()=>{const selected=blocks.filter(b=>b.place==='work'&&b.value===1).slice(0,10);if(selected.length!==10)return;const origins=selected.flatMap(contents);blocks=blocks.filter(b=>!selected.includes(b));blocks.push({id:nextId++,value:10,origin:origins[0],contents:origins,place:'work'});clearFeedback();render();};
$('break').onclick=()=>{const ten=blocks.find(b=>b.place==='work'&&b.value===10);if(!ten)return;blocks=blocks.filter(b=>b!==ten);for(const origin of contents(ten))add(1,origin,'work');clearFeedback();render();};
// Return all reconstructs the exact two original numbers, including after exchanges.
$('return').onclick=()=>setup(first,second);
$('form').onsubmit=e=>{e.preventDefault();const v=$('answer').value.trim();if(!v)return;const correct=Number(v)===first+second;$('feedback').style.color=correct?'#18845a':'#bb3d3d';$('feedback').textContent=correct?'✓ Correct! Great work.':'Not quite. Check your blocks and try again.';};
$('next').onclick=()=>{let a,b;do{a=11+Math.floor(Math.random()*39);b=11+Math.floor(Math.random()*39);}while(a%10+b%10<10);setup(a,b);};
setup(27,35);
})();
</script></body></html>
